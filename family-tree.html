<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tree & Genogram — ผังครอบครัวและระบบนิเวศ</title>
  <meta name="theme-color" content="#4f46e5">

  <!-- Tailwind (JIT, no build step — matches this project's no-build static setup) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pin a single React instance for every module below (app code + lucide-react icons) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>

  <!-- In-browser JSX transform (no build step) -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: 'Segoe UI', 'Sarabun', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" data-presets="react" src="family-tree-app.js"></script>
</body>
</html>
